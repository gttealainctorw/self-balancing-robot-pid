<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Self-balancing robot wiring</title>
<rect width="760" height="740" fill="#ffffff"/>
<g fill="#f4f5f7" stroke="#8a8f99" stroke-width="1">
<rect x="40" y="30" width="250" height="56" rx="8"/>
<rect x="40" y="150" width="180" height="320" rx="8"/>
<rect x="310" y="150" width="170" height="320" rx="8"/>
<rect x="560" y="220" width="160" height="210" rx="8"/>
<rect x="34" y="520" width="90" height="50" rx="8"/>
<rect x="136" y="520" width="90" height="50" rx="8"/>
</g>
<g font-size="13" fill="#3d4250" dominant-baseline="central">
<text x="80" y="58" text-anchor="middle" font-size="16" font-weight="600">+</text>
<text x="130" y="58" text-anchor="middle" font-size="16" font-weight="600">−</text>
<text x="215" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2330">Battery</text>
<text x="215" y="68" text-anchor="middle">7.4–12 V (2S/3S)</text>
<text x="80" y="168" text-anchor="middle">12V</text>
<text x="130" y="168" text-anchor="middle">GND</text>
<text x="180" y="168" text-anchor="middle" fill="#9aa0aa">5V</text>
<text x="120" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2330">L298N</text>
<text x="120" y="223" text-anchor="middle">remove jumpers</text>
<text x="120" y="239" text-anchor="middle">ENA and ENB</text>
<text x="212" y="270" text-anchor="end">ENA</text>
<text x="212" y="300" text-anchor="end">IN1</text>
<text x="212" y="330" text-anchor="end">IN2</text>
<text x="212" y="360" text-anchor="end">IN3</text>
<text x="212" y="390" text-anchor="end">IN4</text>
<text x="212" y="420" text-anchor="end">ENB</text>
<text x="58" y="452" text-anchor="middle" font-size="11.5">OUT1</text>
<text x="100" y="452" text-anchor="middle" font-size="11.5">OUT2</text>
<text x="160" y="452" text-anchor="middle" font-size="11.5">OUT3</text>
<text x="202" y="452" text-anchor="middle" font-size="11.5">OUT4</text>
<text x="350" y="168" text-anchor="middle">VIN</text>
<text x="420" y="168" text-anchor="middle">GND</text>
<text x="395" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2330">Arduino Nano</text>
<text x="395" y="223" text-anchor="middle">or Nano ESP32</text>
<text x="395" y="239" text-anchor="middle">(on the shield)</text>
<text x="318" y="270">D9</text>
<text x="318" y="300">D7</text>
<text x="318" y="330">D8</text>
<text x="318" y="360">D5</text>
<text x="318" y="390">D4</text>
<text x="318" y="420">D3</text>
<text x="472" y="270" text-anchor="end">5V / 3V3 *</text>
<text x="472" y="300" text-anchor="end">GND</text>
<text x="472" y="330" text-anchor="end">A4 (SDA)</text>
<text x="472" y="360" text-anchor="end">A5 (SCL)</text>
<text x="472" y="390" text-anchor="end">D2</text>
<text x="568" y="270">VCC</text>
<text x="568" y="300">GND</text>
<text x="568" y="330">SDA</text>
<text x="568" y="360">SCL</text>
<text x="568" y="390">INT (optional)</text>
<text x="640" y="246" text-anchor="middle" font-size="15" font-weight="600" fill="#1d2330">MPU6050</text>
<text x="640" y="412" text-anchor="middle">GY-521 · X → forward</text>
<text x="79" y="537" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2330">Motor A</text>
<text x="79" y="555" text-anchor="middle">left</text>
<text x="181" y="537" text-anchor="middle" font-size="14" font-weight="600" fill="#1d2330">Motor B</text>
<text x="181" y="555" text-anchor="middle">right</text>
</g>
<g fill="none" stroke-width="2.5" stroke-linejoin="round">
<path d="M80 86 L80 150" stroke="#e24b4a"/>
<path d="M80 115 L124 115 A6 6 0 0 1 136 115 L350 115 L350 150" stroke="#e24b4a"/>
<path d="M130 86 L130 150" stroke="#555a66"/>
<path d="M130 100 L420 100 L420 150" stroke="#555a66"/>
</g>
<circle cx="80" cy="115" r="4" fill="#e24b4a"/>
<circle cx="130" cy="100" r="4" fill="#555a66"/>
<g stroke="#378add" stroke-width="2">
<line x1="220" y1="270" x2="310" y2="270"/><line x1="220" y1="300" x2="310" y2="300"/>
<line x1="220" y1="330" x2="310" y2="330"/><line x1="220" y1="360" x2="310" y2="360"/>
<line x1="220" y1="390" x2="310" y2="390"/><line x1="220" y1="420" x2="310" y2="420"/>
</g>
<line x1="480" y1="270" x2="560" y2="270" stroke="#ef9f27" stroke-width="2.5"/>
<line x1="480" y1="300" x2="560" y2="300" stroke="#555a66" stroke-width="2.5"/>
<g stroke="#1d9e75" stroke-width="2">
<line x1="480" y1="330" x2="560" y2="330"/><line x1="480" y1="360" x2="560" y2="360"/>
<line x1="480" y1="390" x2="560" y2="390" stroke-dasharray="5 4"/>
</g>
<g stroke="#d85a30" stroke-width="2.5">
<line x1="58" y1="470" x2="58" y2="520"/><line x1="100" y1="470" x2="100" y2="520"/>
<line x1="160" y1="470" x2="160" y2="520"/><line x1="202" y1="470" x2="202" y2="520"/>
</g>
<g font-size="12.5" fill="#3d4250" dominant-baseline="central">
<line x1="40" y1="610" x2="64" y2="610" stroke="#e24b4a" stroke-width="2.5"/><text x="72" y="610">Battery + (through a switch)</text>
<line x1="280" y1="610" x2="304" y2="610" stroke="#555a66" stroke-width="2.5"/><text x="312" y="610">Common GND</text>
<line x1="470" y1="610" x2="494" y2="610" stroke="#ef9f27" stroke-width="2.5"/><text x="502" y="610">MPU supply *</text>
<line x1="40" y1="634" x2="64" y2="634" stroke="#378add" stroke-width="2"/><text x="72" y="634">Motor control</text>
<line x1="280" y1="634" x2="304" y2="634" stroke="#1d9e75" stroke-width="2"/><text x="312" y="634">I2C (INT optional)</text>
<line x1="470" y1="634" x2="494" y2="634" stroke="#d85a30" stroke-width="2.5"/><text x="502" y="634">Motor outputs</text>
<text x="40" y="668" font-weight="600" fill="#b0451f">* Classic Nano: MPU VCC → 5V.   Nano ESP32: MPU VCC → 3V3</text>
<text x="40" y="688">(the Nano ESP32 "5V/VBUS" terminal is only powered while USB is connected).</text>
<text x="40" y="710">The hop in the red wire is a crossing WITHOUT connection. If a wheel spins backwards, swap its 2 wires or use invl/invr.</text>
</g>
</svg>
